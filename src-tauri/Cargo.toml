[package]
name = "northstar"
version = "0.1.7"
description = "Northstar Field CAD desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "northstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The mock runtime, so a test can send a command the way the window does.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# The bridge hands the converter its bytes as base64, and the installer checks
# the pinned download with SHA-256. Both were already in the tree through Tauri.
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
