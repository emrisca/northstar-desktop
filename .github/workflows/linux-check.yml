name: Linux check

# Throwaway: proves the Linux build and package path before the release job comes
# back. Deleted along with the branch that carries it.

on:
  push:
    branches:
      - ci/linux-check

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Linux desktop build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran libfuse2 curl unzip \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf

      - run: npm ci

      - name: Build the Linux RTKLIB bundle
        run: scripts/bundle-rtklib-linux.sh

      - run: npm test

      - name: Build the .deb and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:linux

      - run: npm run verify:package

      - name: List the packaged files
        if: always()
        run: find src-tauri/target/release/bundle -maxdepth 3 -type f \( -name '*.deb' -o -name '*.AppImage' \) -print
